<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELIX.DROP — Каталог</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">
      <img src="https://via.placeholder.com/40" alt="Logo">
      <span>VELIX.DROP</span>
    </div>
    <div class="header-actions">
      <button id="adminLoginBtn" class="btn-secondary">Вход</button>
      <button id="cartBtn" class="btn-primary">Корзина <span id="cartCount">0</span></button>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <h3>ПОИСК</h3>
      <input type="text" id="searchInput" placeholder="Название товара...">
      
      <h3>КАТАЛОГ</h3>
      <ul id="categoriesList" class="categories-list">
        <li class="loading">Загрузка...</li>
      </ul>
    </aside>

    <main class="content">
      <div class="content-header">
        <h1 id="categoryTitle">Все товары</h1>
        <p>Оформление заказа напрямую через WhatsApp</p>
      </div>

      <div id="errorMessage" class="error-msg hidden"></div>
      
      <div id="productsGrid" class="products-grid">
        <!-- Товары загружаются динамически -->
      </div>
    </main>
  </div>

  <!-- Модальное окно ввода пароля -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content auth-box">
      <h2>Вход в панель админа</h2>
      <p>Введите пароль администратора:</p>
      <input type="password" id="adminPasswordInput" placeholder="Пароль...">
      <div id="authError" class="auth-error hidden">Неверный пароль!</div>
      <div class="modal-actions">
        <button id="submitPasswordBtn" class="btn-primary">Войти</button>
        <button id="closeAuthBtn" class="btn-secondary">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно Админ-Панели -->
  <div id="adminPanelModal" class="modal hidden">
    <div class="modal-content admin-box">
      <div class="admin-header">
        <h2>Управление товарами</h2>
        <button id="closeAdminBtn" class="btn-close">&times;</button>
      </div>

      <!-- Форма добавления -->
      <form id="addProductForm" class="admin-form">
        <h3>Добавить новый товар</h3>
        <input type="text" id="newTitle" placeholder="Название товара" required>
        <input type="number" id="newPrice" placeholder="Цена (руб)" required>
        
        <select id="newCategory" required>
          <option value="">Выберите категорию</option>
          <option value="t-shirts">Футболки</option>
          <option value="longsleeves">Лонгсливы</option>
          <option value="jeans">Джинсы</option>
          <option value="pants">Штаны</option>
          <option value="shorts">Шорты</option>
          <option value="sneakers">Кроссовки</option>
        </select>

        <label class="file-label">
          <span>Выберите фото товара:</span>
          <input type="file" id="newImage" accept="image/*" required>
        </label>

        <button type="submit" class="btn-primary">Загрузить товар</button>
      </form>

      <hr>

      <!-- Список товаров для удаления -->
      <h3>Удаление товаров</h3>
      <div id="adminProductsList" class="admin-products-list">
        <!-- Список загружается скриптом -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
