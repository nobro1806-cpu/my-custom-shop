<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Управление VELIX.DROP</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --accent: #38bdf8;
      --red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem 1rem;
      max-width: 480px;
      margin: 0 auto;
    }

    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 1.5rem; color: var(--accent); }

    .card-box {
      background: var(--card-bg);
      padding: 1.2rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }

    label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

    input, select {
      width: 100%; padding: 0.8rem; border-radius: 10px;
      border: 1px solid var(--border); background: #0f172a; color: #fff; font-size: 1rem;
    }

    .file-upload {
      border: 2px dashed var(--border); background: #0f172a;
      border-radius: 10px; padding: 1rem; text-align: center; position: relative;
    }

    .file-upload input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }

    .submit-btn {
      width: 100%; background: var(--accent); color: #000; border: none;
      padding: 0.9rem; border-radius: 10px; font-weight: 800; cursor: pointer;
    }

    .product-list { display: flex; flex-direction: column; gap: 0.8rem; }

    .item-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #0f172a; padding: 0.8rem; border-radius: 10px; border: 1px solid var(--border);
    }

    .item-info { display: flex; align-items: center; gap: 0.8rem; }
    .item-info img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }

    .del-btn {
      background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red);
      padding: 0.5rem 0.8rem; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Панель управления</h1>

  <div class="card-box">
    <h3 style="margin-bottom: 1rem;">Добавить товар</h3>
    <form id="add-form">
      <div class="field">
        <label>Пароль доступа</label>
        <input type="password" id="password" placeholder="Пароль" required>
      </div>
      <div class="field">
        <label>Название товара</label>
        <input type="text" id="title" placeholder="Наименование" required>
      </div>
      <div class="field">
        <label>Категория</label>
        <select id="category" required>
          <option value="t-shirts">Футболки</option>
          <option value="longsleeves">Лонгсливы</option>
          <option value="jeans">Джинсы</option>
          <option value="pants">Штаны</option>
          <option value="shorts">Шорты</option>
          <option value="sneakers">Кроссовки</option>
        </select>
      </div>
      <div class="field">
        <label>Цена (сом)</label>
        <input type="number" id="price" placeholder="Цена в сомах" required>
      </div>
      <div class="field">
        <label>Фотография</label>
        <div class="file-upload">
          <span id="file-text">📷 Выбрать фото</span>
          <input type="file" id="image" accept="image/*">
        </div>
      </div>
      <button type="submit" class="submit-btn">Опубликовать</button>
    </form>
  </div>

  <h3>Список товаров</h3>
  <br>
  <div class="product-list" id="product-list">Загрузка...</div>

  <script>
    const API_URL = 'http://localhost:3000/api/products';

    document.getElementById('image').addEventListener('change', (e) => {
      if(e.target.files[0]) document.getElementById('file-text').innerText = '✓ ' + e.target.files[0].name;
    });

    async function loadProducts() {
      const res = await fetch(API_URL);
      const products = await res.json();
      const list = document.getElementById('product-list');
      list.innerHTML = '';

      products.forEach(p => {
        list.innerHTML += `
          <div class="item-row">
            <div class="item-info">
              <img src="${p.img}" alt="">
              <div>
                <div style="font-weight: bold;">${p.title}</div>
                <div style="color: var(--accent); font-size: 0.85rem;">${p.price.toLocaleString()} сом</div>
              </div>
            </div>
            <button class="del-btn" onclick="deleteProduct(${p.id})">Удалить</button>
          </div>
        `;
      });
    }

    async function deleteProduct(id) {
      const password = document.getElementById('password').value;
      if(!password) return alert('Введите пароль выше!');

      if(!confirm('Удалить товар?')) return;

      const res = await fetch(`${API_URL}/${id}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });

      if(res.ok) loadProducts();
      else {
        const d = await res.json();
        alert('Ошибка: ' + d.error);
      }
    }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('password', document.getElementById('password').value);
      formData.append('title', document.getElementById('title').value);
      formData.append('category', document.getElementById('category').value);
      formData.append('price', document.getElementById('price').value);
      if(document.getElementById('image').files[0]) {
        formData.append('image', document.getElementById('image').files[0]);
      }

      const res = await fetch(API_URL, { method: 'POST', body: formData });
      if(res.ok) {
        alert('Товар добавлен!');
        document.getElementById('title').value = '';
        document.getElementById('price').value = '';
        document.getElementById('file-text').innerText = '📷 Выбрать фото';
        loadProducts();
      } else {
        const d = await res.json();
        alert('Ошибка: ' + d.error);
      }
    });

    loadProducts();
  </script>
</body>
</html>
